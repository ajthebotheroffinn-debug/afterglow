name: Afterglow
options:
  bundleIdPrefix: com.afterglow
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_BITCODE: "NO"
targets:
  Afterglow:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: ../web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Afterglow
        PRODUCT_BUNDLE_IDENTIFIER: com.afterglow.app
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TK_REMOTE_URL: ""
    scheme: {}
